<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Indian Road Drive</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  touch-action:none;
}

body{
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.45);
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
}

#controls{
  position:fixed;
  bottom:25px;
  left:0;
  right:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
}

.group{
  display:flex;
  gap:12px;
}

button{
  width:70px;
  height:70px;
  border:none;
  border-radius:50%;
  background:rgba(10,10,10,.65);
  color:white;
  font-size:27px;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,.5);
}

button:active{
  transform:scale(.92);
  background:rgba(0,120,255,.8);
}

#title{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:white;
  font-size:20px;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="title">🇮🇳 INDIAN ROAD DRIVE</div>

<div id="hud">
  SPEED: <span id="speed">0</span> KM/H<br>
  DISTANCE: <span id="distance">0</span> M
</div>

<div id="controls">

  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>

  <div class="group">
    <button id="brake">▼</button>
    <button id="gas">▲</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
  0x87ceeb,
  70,
  450
);


/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.set(
  0,
  4.5,
  9
);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  innerWidth,
  innerHeight
