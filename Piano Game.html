<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Black Piano Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #ff1a1a;
  text-shadow: 0 0 15px red;
}

#info {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 15px;
  font-size: 18px;
}

.game {
  width: 95%;
  max-width: 700px;
  margin: auto;
  background: #111;
  border: 2px solid #ff0000;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 0 25px #ff0000;
}

#falling {
  height: 250px;
  background: #080808;
  border: 2px solid #333;
  position: relative;
  overflow: hidden;
  border-radius: 10px;
}

.note {
  position: absolute;
  top: -60px;
  width: 11%;
  height: 50px;
  background: #ff0000;
  border-radius: 8px;
  box-shadow: 0 0 15px red;
}

.piano {
  display: flex;
  height: 180px;
  margin-top: 15px;
}

.key {
  flex: 1;
  margin: 2px;
  border: 2px solid #222;
  border-radius: 0 0 10px 10px;
  background: white;
  color: black;
  font-weight: bold;
  font-size: 18px;
  cursor: pointer;
}

.key:active,
