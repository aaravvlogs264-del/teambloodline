<!DOCTYPE html>
<html>
<head>
  <title>Stone Paper Caesar</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      text-align: center;
    }

    .game {
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      background: #1b1b1b;
      border: 2px solid #ff3333;
      border-radius: 20px;
      box-shadow: 0 0 25px #ff3333;
    }

    h1 {
      color: #ff3333;
      font-size: 35px;
    }

    #display {
      background: #000;
      border: 2px solid #555;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      font-size: 20px;
      min-height: 80px;
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      background: #ff3333;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #ff6666;
      transform: scale(1.08);
    }

    .score {
      margin-top: 25px;
      font-size: 20px;
    }

    #result {
      font-size: 25px;
      font-weight: bold;
      margin-top: 15px;
    }

    .reset {
      margin-top: 20px;
      background: #444;
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🪨 Stone 📄 Paper ✂️ Caesar</h1>

    <div id="display">
      Choose your move!
    </div>

    <div class="choices">
      <button onclick="play('stone')">🪨 Stone</button>
      <button onclick="play('paper')">📄 Paper</button>
      <button onclick="play('caesar')">✂️ Caesar</button>
    </div>

    <div id="result">Let's Play!</div>

    <div class="score">
      You: <span id="playerScore">0</span>
      &nbsp; | &nbsp;
      Computer: <span id="computerScore">0</span>
    </div>

    <button class="reset" onclick="resetGame()">🔄 Reset Game</button>
  </div>

<script>
  let playerScore = 0;
  let computerScore = 0;

  const choices = ["stone", "paper", "caesar"];

  function play(player) {
    const computer =
      choices[Math.floor(Math.random() * choices.length)];

    let result = "";

    if (player === computer) {
      result = "🤝 It's a Draw!";
    }
    else if (
      (player === "stone" && computer === "caesar") ||
      (player === "paper" && computer === "stone") ||
      (player === "caesar" && computer === "paper")
    ) {
      playerScore++;
      result = "🎉 You Win!";
    }
    else {
      computerScore++;
      result = "💻 Computer Wins!";
    }

    document.getElementById("display").innerHTML =
      "You chose: <b>" + player.toUpperCase() +
      "</b><br>Computer chose: <b>" +
      computer.toUpperCase() + "</b>";

    document.getElementById("result").innerText = result;

    document.getElementById("playerScore").innerText = playerScore;
    document.getElementById("computerScore").innerText = computerScore;
  }

  function resetGame() {
    playerScore = 0;
    computerScore = 0;

    document.getElementById("playerScore").innerText = 0;
    document.getElementById("computerScore").innerText = 0;

    document.getElementById("display").innerText =
      "Choose your move!";

    document.getElementById("result").innerText =
      "Let's Play!";
  }
</script>

</body>
</html>
