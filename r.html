<!DOCTYPE html>
<html>
<head>
<title>FF MAX Panel</title>
<style>
body{
  margin:0;
  background:#080808;
  color:white;
  font-family:Arial;
  text-align:center;
}
.box{
  width:300px;
  margin:50px auto;
  padding:25px;
  background:#111;
  border:2px solid red;
  border-radius:15px;
  box-shadow:0 0 20px red;
}
h1{color:red}
button{
  padding:12px 25px;
  margin:8px;
  background:red;
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
}
input{
  width:90%;
  accent-color:red;
}
</style>
</head>

<body>

<div class="box">
  <h1>FF MAX</h1>
  <p>Gaming Panel</p>

  <h3>Sensitivity</h3>
  <input type="range" min="0" max="100" value="95">

  <br>

  <button onclick="alert('Panel Started!')">
    START
  </button>

  <button onclick="alert('Loadout Opened!')">
    LOADOUT
  </button>

  <p>🔥 Team BloodLine</p>
</div>

</body>
</html>
