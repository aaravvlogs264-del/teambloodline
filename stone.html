<!DOCTYPE html>
<html>
<head>
  <title>Stone Paper Caesar</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      color: red;
      margin-top: 40px;
    }

    .game {
      margin-top: 50px;
    }

    button {
      padding: 18px 25px;
      margin: 10px;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid red;
      border-radius: 12px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: red;
    }

    #result {
      font-size: 25px;
      margin: 30px;
      color: #00ff66;
    }

    #score {
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>🔥 STONE • PAPER • CAESAR 🔥</h1>

  <div class="game">
    <button onclick="play('stone')">🪨 Stone</button>
    <button onclick="play('paper')">📄 Paper</button>
    <button onclick="play('caesar')">✂️ Caesar</button>

    <div id="result">Choose your move!</div>

    <div id="score">
      You: 0 | Computer: 0 | Draws: 0
    </div>
  </div>

<script>
  let userScore = 0;
  let computerScore = 0;
  let draws = 0;

  function play(userChoice) {

    const choices = ["stone", "paper", "caesar"];
    const computerChoice =
      choices[Math.floor(Math.random() * choices.length)];

    let result = "";

    if (userChoice === computerChoice) {
      result = "🤝 DRAW!";
      draws++;
    }
    else if (
      (userChoice === "stone" && computerChoice === "caesar") ||
      (userChoice === "paper" && computerChoice === "stone") ||
      (userChoice === "caesar" && computerChoice === "paper")
    ) {
      result = "🏆 YOU WIN!";
      userScore++;
    }
    else {
      result = "💀 COMPUTER WINS!";
      computerScore++;
    }

    document.getElementById("result").innerHTML =
      "You chose: " + userChoice.toUpperCase() +
      "<br>Computer chose: " + computerChoice.toUpperCase() +
      "<br><br>" + result;

    document.getElementById("score").innerHTML =
      "You: " + userScore +
      " | Computer: " + computerScore +
      " | Draws: " + draws;
  }
</script>

</body>
</html>
